[project]
name = "ct-mri-dicom-nii-reader"
version = "0.1.2"
description = "Read CT/MRI DICOM series and NIfTI volumes into isotropic LPS-ordered NumPy arrays"
authors = [
    {name = "GGN_2015",email = "neko@jlulug.org"}
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "simpleitk",
    "pillow",
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
